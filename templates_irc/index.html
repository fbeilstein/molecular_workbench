<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRC Pipeline Master Tool</title>
    <script type="importmap">
      {
        "imports": {
          "three": "/static_irc/libs/three.module.js",
          "three/addons/controls/OrbitControls.js": "/static_irc/libs/OrbitControls.js",
          "three/addons/controls/TransformControls.js": "/static_irc/libs/TransformControls.js"
        }
      }
    </script>
    <script src="/static_irc/libs/3Dmol-min.js" onerror="this.onerror=null;this.src='https://3Dmol.org/build/3Dmol-min.js'"></script>
    <link rel="stylesheet" href="/static_irc/style.css">
    <link rel="stylesheet" href="/static_irc/css/bundle.css?v=2.0.9">
</head>
<body>
    <div class="container">
        <header style="display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 1rem;">
            <div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap;">
                <h1 style="margin: 0; font-size: 1.45rem;">IRC Pipeline Wizard</h1>
                
                <!-- Multistep Reaction Project Bar -->
                <div id="project-step-bar" style="display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); padding: 4px 10px; border-radius: 8px;">
                    <span style="font-size: 11.5px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px;">Reaction:</span>
                    <select id="reaction-step-select" style="padding: 4px 8px; font-size: 12.5px; font-weight: 600; border-radius: 6px; border: 1px solid #475569; background: #1e293b; color: #f8fafc; cursor: pointer; max-width: 340px; text-overflow: ellipsis; outline: none;">
                        <option value="step_1">Step 1: Reaction</option>
                    </select>
                    <button id="btn-add-step" class="secondary" style="padding: 4px 10px; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 4px;" title="Add next elementary reaction step (automatically seeds product as reactant)">
                        ➕ Add Step
                    </button>
                    <button id="btn-delete-step" style="padding: 4px 8px; font-size: 12px; border: 1px solid rgba(239,68,68,0.4); background: rgba(239,68,68,0.1); color: #f87171; border-radius: 6px; cursor: pointer;" title="Delete this reaction step">
                        🗑️
                    </button>
                </div>
            </div>
            
            <div style="display: flex; align-items: center; gap: 8px;">
                <button id="btn-save-project" class="secondary" style="padding: 6px 12px; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 4px;" title="Export and download complete reaction project archive (.zip)">
                    💾 Save Project
                </button>
                <button id="btn-open-project" class="secondary" style="padding: 6px 12px; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 4px;" title="Open / restore previously saved reaction project archive (.zip)">
                    📂 Open Project
                </button>
                <input type="file" id="file-open-project" accept=".zip" style="display: none;">
                <button id="btn-reset" class="danger">Reset Step</button>
            </div>
        </header>

        <div id="wizard-tabs" class="tabs">
            <!-- Tabs injected dynamically -->
        </div>

        <div id="step-content" class="content">
            <!-- Step UI injected dynamically -->
            <div id="schema-container"></div>
            
            <div id="error-container" class="error-msg" style="display: none;"></div>
            
            <div class="navigation-buttons" style="display: flex; align-items: center; gap: 14px; margin-top: 1rem;">
                <button id="btn-run" class="primary" style="padding: 8px 24px; font-size: 13.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;">
                    💾 Apply
                </button>
                <span id="apply-feedback" style="display: none; font-size: 13px; font-weight: 600; color: #4ade80; transition: opacity 0.3s ease;"></span>
            </div>
        </div>
    </div>

    <script type="module" src="/static_irc/app.js?v=2.1.5"></script>
</body>
</html>
