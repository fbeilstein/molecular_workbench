<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRC Pipeline Master Tool</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <link rel="stylesheet" href="/static_irc/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>IRC Pipeline Wizard</h1>
            <button id="btn-reset" class="danger">Reset Pipeline</button>
        </header>

        <div id="wizard-tabs" class="tabs">
            <!-- Tabs injected dynamically -->
        </div>

        <div id="step-content" class="content">
            <!-- Step UI injected dynamically -->
            <div id="schema-container"></div>
            
            <div id="error-container" class="error-msg" style="display: none;"></div>
            
            <div class="navigation-buttons">
                <button id="btn-run" class="primary">Run & Continue</button>
            </div>
        </div>
    </div>

    <script type="module" src="/static_irc/app.js"></script>
</body>
</html>
