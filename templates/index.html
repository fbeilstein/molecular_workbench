<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecular Workbench</title>
    <link rel="stylesheet" href="/static/app.css">
    <script src="https://3Dmol.org/build/3Dmol-min.js"></script>
</head>

<body>

    <!-- Top Toolbar -->
    <header class="toolbar">
        <h1>⚗️ <span>Molecular</span> Workbench</h1>
        <div class="toolbar-controls">
            <div class="field-group">
                <label>Name:</label>
                <input type="text" id="job-name" value="" placeholder="auto" style="width:100px;">
            </div>
            <div class="field-group">
                <label>Load Job:</label>
                <select id="run-chooser" onchange="WB.loadRun()" style="width:120px;">
                    <option value="">-- select --</option>
                </select>
            </div>
            <div class="field-group">
                <label>Charge:</label>
                <input type="number" id="mol-charge" value="0" style="width:50px;">
            </div>
            <div class="field-group">
                <label>Engine:</label>
                <select id="qm-engine" style="width:100px;">
                    <option value="xtb">Fast (xTB)</option>
                    <option value="pyscf">Accurate (PySCF)</option>
                    <option value="pyscf-flat">Accurate (PySCF Flat Start)</option>
                    <option value="none">None (2D Flat)</option>
                </select>
            </div>
            <div class="field-group" style="flex-direction:row; gap:4px; align-items:center;" title="Use SCF Level Shift (0.2) to help difficult aromatic systems converge">
                <input type="checkbox" id="pyscf-levelshift" style="width:auto; margin:0;">
                <label for="pyscf-levelshift" style="font-size:10px; width:45px; white-space:normal; line-height:1;">SCF Lvl<br>Shift</label>
            </div>

                                <button class="btn btn-primary" onclick="WB.generateComputeScript()">🚀 Compute</button>
                    <button class="btn btn-danger" id="btn-stop" onclick="WB.stopCompute()" style="display:none; background:#e74c3c;">🛑 Stop</button>
            
            
        </div>
    </header>

    <!-- Main Layout -->
    <div class="main-area">

        <!-- Left: Ketcher -->
        <div class="panel ketcher-panel">
            <iframe id="ketcher-frame" src="/ketcher/index.html"></iframe>
        </div>

        <div class="resizer" id="dragMe"></div>

        <!-- Right: 3D Viewer + Orbital Sidebar -->
        <div class="panel viewer-panel">
            <div style="flex:1; display:flex; flex-direction:column; min-width:0;">
                <div class="viz-controls">
                    <div id="chemical-chooser-wrap" style="display:none;">
                        <label>Chemical:</label>
                        <select id="chemical-chooser" onchange="WB.loadChemical()"></select>
                    </div>
                </div>
                <div style="flex:1; position:relative;">
                    <div id="viewer-3d" style="width:100%;height:100%;position:absolute;"></div>
                    <div id="viewer-info" class="viewer-info">Draw a molecule in Ketcher, then click 🚀 Compute</div>
                    <!-- ESP Colorbar Overlay -->
                    <div id="esp-colorbar" class="esp-colorbar" style="display:none; position:absolute; top:12px; left:50%; transform:translateX(-50%); width:260px; background:rgba(15,20,28,0.85); border:1px solid rgba(255,255,255,0.15); border-radius:8px; padding:6px 12px; flex-direction:column; gap:3px; z-index:10; pointer-events:none; box-shadow:0 4px 16px rgba(0,0,0,0.4);">
                        <div style="font-size:9px; font-weight:600; color:#94a3b8; text-align:center; text-transform:uppercase; letter-spacing:0.5px;">Electrostatic Potential (kcal/mol)</div>
                        <div style="height:9px; width:100%; border-radius:3px; border:1px solid rgba(255,255,255,0.2); background:linear-gradient(90deg, #ff3333 0%, #ffffff 50%, #3333ff 100%);"></div>
                        <div style="display:flex; justify-content:space-between; font-size:10px; font-weight:700; color:#e2e8f0;">
                            <span id="esp-colorbar-min">-30.0</span>
                            <span>0</span>
                            <span id="esp-colorbar-max">+30.0</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Orbital Sidebar -->
            <div class="viz-sidebar" id="orbital-sidebar">
                <div class="viz-sidebar-header">
                    <span>Orbitals</span>
                </div>
                <div style="padding: 10px 15px; background: #161622; border-bottom: 1px solid #333;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
                        <label style="font-size:12px; color:#aaa;">Isovalue:</label>
                        <span id="isovalue-display" style="font-size:12px; color:#00ffff;">0.02</span>
                    </div>
                    <input type="range" id="isovalue-slider" min="0.005" max="0.1" step="0.005" value="0.02" style="width:100%;" onchange="WB.remeshCurrentOrbital(this.value)" oninput="document.getElementById('isovalue-display').innerText=this.value">
                </div>
                <div id="orbital-toggles"></div>
                <div style="padding: 10px; padding-bottom: 70px; display:flex; flex-direction:column; gap:8px;">
                    <button class="btn btn-primary" style="width:100%; font-size:11px;" onclick="WB.downloadCustomBundle()">📦 Download Bundle</button>
                    <button id="btn-purge-cubes" class="btn btn-danger" style="width:100%; font-size:11px;" onclick="WB.purgeCubes()" disabled>🗑 Purge Cube Files</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Log Panel (bottom drawer) -->
    <div id="log-drawer" class="log-drawer">
        <div class="log-resizer" id="logDragMe"></div>
        <div class="log-header" onclick="WB.toggleLog()">
            <span>📋 Job Log</span>
            <span id="log-status"></span>
            <span class="log-toggle">▲</span>
        </div>
        <pre id="log-content" class="log-content"></pre>
    </div>

    <!-- Status bar -->
    <div id="status-bar" class="status-bar">Ready</div>

    <!-- Export Bundle Modal -->
    <div id="export-modal" class="modal" style="display:none; position:fixed; z-index:9999; left:0; top:0; width:100%; height:100%; background-color:rgba(0,0,0,0.7);">
        <div class="modal-content" style="background-color:#1e1e2d; margin:10% auto; padding:20px; border:1px solid #444; width:400px; border-radius:8px; display:flex; flex-direction:column; max-height:80vh;">
            <h2 style="margin-top:0;">Export Bundle</h2>
            <p style="color:#aaa; font-size:13px; margin-bottom:10px;">Select which orbitals to save in the `.rxnbundle` archive:</p>
            <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; background:#161622; padding:6px 10px; border-radius:4px; border:1px solid #333;">
                <label for="export-isovalue" style="font-size:12px; color:#ccc;">Mesh Isovalue:</label>
                <input type="number" id="export-isovalue" step="0.005" min="0.005" max="0.2" value="0.045" style="width:80px; background:#1e1e2d; border:1px solid #555; color:#fff; padding:3px 6px; border-radius:4px; font-size:12px; text-align:right;">
            </div>
            <div id="export-orbital-list" style="flex:1; overflow-y:auto; margin-bottom:15px; border:1px solid #333; padding:10px; background:#161622;">
                <!-- Checkboxes injected here -->
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <label style="font-size:12px; cursor:pointer;"><input type="checkbox" id="export-select-all" onclick="WB.toggleExportSelectAll(this)" checked> Select All</label>
                <div style="display:flex; gap:10px;">
                    <button class="btn" onclick="document.getElementById('export-modal').style.display='none'">Cancel</button>
                    <button class="btn btn-primary" onclick="WB.confirmDownloadBundle()">Download</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/resizer.js"></script>
    <script src="/static/orbital_renderer.js"></script>
    <script src="/static/bundle_loader.js"></script>
    <script src="/static/export.js"></script>
    <script src="/static/app.js"></script>
</body>

</html>
